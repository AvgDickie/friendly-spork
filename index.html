<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple SPA</title>
  <style>
    html,
    body,
    div,
    span,
    applet,
    object,
    iframe,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    p,
    blockquote,
    pre,
    a,
    abbr,
    acronym,
    address,
    big,
    cite,
    code,
    del,
    dfn,
    em,
    img,
    ins,
    kbd,
    q,
    s,
    samp,
    small,
    strike,
    strong,
    sub,
    sup,
    tt,
    var,
    b,
    u,
    i,
    center,
    dl,
    dt,
    dd,
    ol,
    ul,
    li,
    fieldset,
    form,
    label,
    legend,
    table,
    caption,
    tbody,
    tfoot,
    thead,
    tr,
    th,
    td,
    article,
    aside,
    canvas,
    details,
    embed,
    figure,
    figcaption,
    footer,
    header,
    hgroup,
    menu,
    nav,
    output,
    ruby,
    section,
    summary,
    time,
    mark,
    audio,
    video {
      box-sizing: border-box;
      -moz-box-sizing: border-box;
      -webkit-box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0;
      font-size: 100%;
      font: inherit;
      vertical-align: baseline;
    }

    /* HTML5 display-role reset for older browsers */
    article,
    aside,
    details,
    figcaption,
    figure,
    footer,
    header,
    hgroup,
    menu,
    nav,
    section {
      display: block;
    }

    body {
      line-height: 1;
    }

    ol,
    ul {
      list-style: none;
    }

    blockquote,
    q {
      quotes: none;
    }

    blockquote:before,
    blockquote:after,
    q:before,
    q:after {
      content: '';
      content: none;
    }

    table {
      border-collapse: collapse;
      border-spacing: 0;
    }

    /* Additional Resets */
    /* CSS Grid and Flexbox */
    .container {
      display: flex;
      flex-wrap: wrap;
    }

    .item {
      flex: 1;
    }

    /* Form Elements */
    input[type="text"],
    input[type="password"],
    textarea {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      border: 1px solid #ccc;
      padding: 8px;
      border-radius: 4px;
    }

    /* Pseudo-elements */
    ::before,
    ::after {
      content: '';
    }

    /* Media Queries */
    @media (max-width: 600px) {
      .container {
        flex-direction: column;
      }
    }

    /* Typography */
    body {
      font-family: 'Arial', sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #333;
      background-color: #25042B;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-weight: normal;
    }

    /* Custom Checkboxes and Radio Buttons */
    input[type="checkbox"],
    input[type="radio"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      display: inline-block;
      width: 20px;
      height: 20px;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 50%;
    }

    input[type="checkbox"]:checked,
    input[type="radio"]:checked {
      background-color: #007bff;
      border-color: #007bff;
    }

    /* Additional Typography Features */
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* end reset */
    html {

      display: flex;
      height: 100vh;
      border: 30px solid deeppink;
    }

    body {
      display: flex;
      flex: 1;
      border: 30px solid lime;
      background-color: #333;
    }

    .df {
      border: 30px solid #AD0AFD;
      display: flex;
      flex: 1;
    }

    .item-link-box {
      width: 511px;
      height: 256px;
      border: 18px solid #FFFF00;
      border-radius: 8px;
      background-color: rgb(8, 2, 100);
    }

    .sixtyfour-convergence-std {
      font-size: 2.75rem;
      font-family: "Sixtyfour Convergence", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      font-variation-settings:
        "BLED" 0,
        "SCAN" 0,
        "XELA" 0,
        "YELA" 0;
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sixtyfour+Convergence&display=swap" rel="stylesheet">

  <script type="module" src="/src/my-element.js"></script>
</head>

<body>
  <div class="df">
    <div style="border: 30px solid #FFFF00; display: flex; flex: 1;">
      <div style="border: 30px solid #0165FC; display: flex; flex:1;">
        <div style="border: 30px solid #FF7124; display: flex; flex: 1;">
          <div style="border: 30px solid #41FDFE; display: flex; flex: 1;">
            <div style="border: 30px solid #FE0002; display: flex; flex: 1;">
              <div class="sixtyfour-convergence-std"
                style="border: 30px solid #FF85FF; display: flex; flex: 1; justify-content: center; align-items: center;">
                # BANG DIRTY #
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
